<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaFlow - Sistema de Agendamento</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #f8fafc;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-slideUp { animation: slideUp 0.4s ease-out; }
        .animate-bounceIn { animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect } = React;

        // Ícones
        const Icons = {
            Calendar: () => <i className="fas fa-calendar"></i>,
            Plus: () => <i className="fas fa-plus-circle"></i>,
            List: () => <i className="fas fa-list"></i>,
            Settings: () => <i className="fas fa-cog"></i>,
            Dashboard: () => <i className="fas fa-chart-line"></i>,
            Menu: () => <i className="fas fa-bars"></i>,
            WhatsApp: () => <i className="fab fa-whatsapp"></i>,
            Google: () => <i className="fab fa-google"></i>,
            Clock: () => <i className="fas fa-clock"></i>,
            Check: () => <i className="fas fa-check-circle"></i>,
            TrendingUp: () => <i className="fas fa-chart-line"></i>,
            Users: () => <i className="fas fa-users"></i>,
            Search: () => <i className="fas fa-search"></i>,
            Filter: () => <i className="fas fa-filter"></i>,
            Eye: () => <i className="fas fa-eye"></i>,
            Trash: () => <i className="fas fa-trash"></i>,
            X: () => <i className="fas fa-times-circle"></i>,
            Phone: () => <i className="fas fa-phone"></i>,
            User: () => <i className="fas fa-user"></i>,
            FileText: () => <i className="fas fa-file-alt"></i>,
            Send: () => <i className="fas fa-paper-plane"></i>,
            Bell: () => <i className="fas fa-bell"></i>,
            Info: () => <i className="fas fa-info-circle"></i>,
            Smartphone: () => <i className="fas fa-mobile-alt"></i>
        };

        // Gerar ID único
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

        // Funções de WhatsApp
        const sendWhatsAppMessage = (appointment) => {
            const phone = appointment.clientPhone.replace(/\D/g, '');
            const date = new Date(appointment.date);
            const formattedDate = date.toLocaleDateString('pt-BR');
            const message = `🗓️ *Confirmação de Agendamento*\n\nOlá, ${appointment.clientName}! 👋\n\nSeu agendamento foi confirmado:\n\n📋 *Serviço:* ${appointment.service}\n📅 *Data:* ${formattedDate}\n⏰ *Horário:* ${appointment.time}\n⏱️ *Duração:* ${appointment.duration} minutos\n\nPor favor, confirme sua presença.\n\n✅ _Mensagem enviada pelo AgendaFlow_`;
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        };

        // Funções do Google Calendar
        const addToGoogleCalendar = (appointment) => {
            const startDate = new Date(`${appointment.date}T${appointment.time}`);
            const endDate = new Date(startDate.getTime() + appointment.duration * 60000);
            
            const formatDate = (date) => {
                return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            };

            const params = new URLSearchParams({
                action: 'TEMPLATE',
                text: `${appointment.service} - ${appointment.clientName}`,
                dates: `${formatDate(startDate)}/${formatDate(endDate)}`,
                details: `Cliente: ${appointment.clientName}\nTelefone: ${appointment.clientPhone}\nServiço: ${appointment.service}\nDuração: ${appointment.duration} minutos${appointment.notes ? '\nObservações: ' + appointment.notes : ''}`,
            });

            const url = `https://calendar.google.com/calendar/render?${params.toString()}`;
            window.open(url, '_blank');
        };

        // Sidebar
        function Sidebar({ currentView, onViewChange, isOpen, onClose }) {
            const menuItems = [
                { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
                { id: 'schedule', label: 'Novo Agendamento', icon: Icons.Plus },
                { id: 'appointments', label: 'Agendamentos', icon: Icons.List },
                { id: 'settings', label: 'Configurações', icon: Icons.Settings }
            ];

            return (
                <>
                    {isOpen && (
                        <div className="fixed inset-0 bg-black/50 z-40 lg:hidden" onClick={onClose} />
                    )}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-64 bg-gradient-to-b from-slate-900 to-slate-800 min-h-screen p-4 flex flex-col shadow-xl transform transition-transform duration-300 ${isOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <div className="flex items-center gap-3 mb-8 px-2">
                            <div className="w-10 h-10 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-xl flex items-center justify-center shadow-lg text-white">
                                <Icons.Calendar />
                            </div>
                            <div>
                                <h1 className="text-white font-bold text-lg">AgendaFlow</h1>
                                <p className="text-slate-400 text-xs">WhatsApp + Google Agenda</p>
                            </div>
                        </div>

                        <nav className="flex-1 space-y-1">
                            {menuItems.map((item) => {
                                const isActive = currentView === item.id;
                                const Icon = item.icon;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => { onViewChange(item.id); onClose(); }}
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition-all duration-200 ${
                                            isActive ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-300 hover:bg-slate-700/50 hover:text-white'
                                        }`}
                                    >
                                        <Icon />
                                        <span className="font-medium text-sm">{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="mt-auto p-4 bg-slate-800/50 rounded-xl border border-slate-700/50">
                            <div className="flex items-center gap-2 mb-2">
                                <div className="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                                <span className="text-emerald-400 text-xs font-medium">Sistema Ativo</span>
                            </div>
                            <p className="text-slate-400 text-xs">Integrações conectadas</p>
                        </div>
                    </aside>
                </>
            );
        }

        // Dashboard
        function Dashboard({ appointments, onNewAppointment }) {
            const today = new Date().toDateString();
            const todayAppointments = appointments.filter(a => new Date(a.date).toDateString() === today);
            const pendingAppointments = appointments.filter(a => a.status === 'pending');
            const confirmedAppointments = appointments.filter(a => a.status === 'confirmed');
            const completedAppointments = appointments.filter(a => a.status === 'completed');

            const stats = [
                { label: 'Hoje', value: todayAppointments.length, icon: Icons.Clock, color: '#3b82f6', bgColor: 'bg-blue-500/10' },
                { label: 'Pendentes', value: pendingAppointments.length, icon: Icons.TrendingUp, color: '#f59e0b', bgColor: 'bg-amber-500/10' },
                { label: 'Confirmados', value: confirmedAppointments.length, icon: Icons.Check, color: '#10b981', bgColor: 'bg-emerald-500/10' },
                { label: 'Total', value: appointments.length, icon: Icons.Users, color: '#8b5cf6', bgColor: 'bg-purple-500/10' }
            ];

            const upcomingAppointments = appointments
                .filter(a => a.status !== 'cancelled' && a.status !== 'completed')
                .sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`))
                .slice(0, 5);

            return (
                <div className="p-6 lg:p-8 max-w-7xl mx-auto animate-fadeIn">
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8">
                        <div>
                            <h1 className="text-2xl lg:text-3xl font-bold text-slate-800">Dashboard</h1>
                            <p className="text-slate-500 mt-1">Visão geral dos seus agendamentos</p>
                        </div>
                        <button
                            onClick={onNewAppointment}
                            className="mt-4 sm:mt-0 inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl font-medium shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 transition-all duration-200 hover:-translate-y-0.5"
                        >
                            <Icons.Calendar />
                            Novo Agendamento
                        </button>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        {stats.map((stat, index) => {
                            const Icon = stat.icon;
                            return (
                                <div
                                    key={stat.label}
                                    className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition-all duration-300 animate-slideUp"
                                    style={{ animationDelay: `${index * 100}ms` }}
                                >
                                    <div className={`w-10 h-10 rounded-xl ${stat.bgColor} flex items-center justify-center mb-3`}>
                                        <span style={{ color: stat.color }}><Icon /></span>
                                    </div>
                                    <p className="text-2xl font-bold text-slate-800">{stat.value}</p>
                                    <p className="text-sm text-slate-500">{stat.label}</p>
                                </div>
                            );
                        })}
                    </div>

                    <div className="grid lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">Próximos Agendamentos</h2>
                            {upcomingAppointments.length === 0 ? (
                                <div className="text-center py-12">
                                    <div className="text-slate-300 text-4xl mb-3"><Icons.Calendar /></div>
                                    <p className="text-slate-400">Nenhum agendamento próximo</p>
                                    <button onClick={onNewAppointment} className="mt-3 text-emerald-600 font-medium text-sm hover:text-emerald-700">
                                        Criar primeiro agendamento →
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {upcomingAppointments.map((apt) => (
                                        <div key={apt.id} className="flex items-center gap-4 p-4 rounded-xl bg-slate-50 hover:bg-slate-100 transition-colors">
                                            <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 flex flex-col items-center justify-center text-white font-bold text-sm shadow-sm">
                                                <span className="text-xs">{new Date(apt.date).toLocaleDateString('pt-BR', { month: 'short' }).slice(0, 3)}</span>
                                                <span className="text-lg">{new Date(apt.date).getDate()}</span>
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <p className="font-medium text-slate-800 truncate">{apt.clientName}</p>
                                                <p className="text-sm text-slate-500">{apt.service} • {apt.time}</p>
                                            </div>
                                            <span className={`px-2 py-1 text-xs font-medium rounded-lg ${
                                                apt.status === 'confirmed' ? 'bg-emerald-100 text-emerald-700' :
                                                apt.status === 'pending' ? 'bg-amber-100 text-amber-700' :
                                                'bg-slate-100 text-slate-600'
                                            }`}>
                                                {apt.status === 'confirmed' ? 'Confirmado' : apt.status === 'pending' ? 'Pendente' : apt.status}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                            <h2 className="text-lg font-semibold text-slate-800 mb-4">Integrações</h2>
                            <div className="space-y-4">
                                <div className="p-4 rounded-xl bg-green-50 border border-green-100">
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center text-white">
                                            <Icons.WhatsApp />
                                        </div>
                                        <div>
                                            <p className="font-medium text-slate-800">WhatsApp</p>
                                            <p className="text-xs text-slate-500">Mensagens automáticas</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 mt-3">
                                        <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                        <span className="text-xs text-green-700 font-medium">Conectado via wa.me</span>
                                    </div>
                                </div>

                                <div className="p-4 rounded-xl bg-blue-50 border border-blue-100">
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center text-white">
                                            <Icons.Google />
                                        </div>
                                        <div>
                                            <p className="font-medium text-slate-800">Google Agenda</p>
                                            <p className="text-xs text-slate-500">Sincronização de eventos</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 mt-3">
                                        <div className="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
                                        <span className="text-xs text-blue-700 font-medium">Conectado via URL</span>
                                    </div>
                                </div>

                                <div className="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-100">
                                    <p className="text-sm font-medium text-slate-700 mb-3">Resumo</p>
                                    <div className="space-y-2">
                                        <div className="flex justify-between text-sm">
                                            <span className="text-slate-500">Concluídos</span>
                                            <span className="font-medium text-slate-800">{completedAppointments.length}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-slate-500">WhatsApp enviados</span>
                                            <span className="font-medium text-slate-800">{appointments.filter(a => a.whatsappSent).length}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-slate-500">Sync Google</span>
                                            <span className="font-medium text-slate-800">{appointments.filter(a => a.calendarSynced).length}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Formulário de Agendamento
        function ScheduleForm({ onSave }) {
            const [formData, setFormData] = useState({
                clientName: '', clientPhone: '', service: '', date: '', time: '', duration: 30, notes: ''
            });
            const [sendWhatsapp, setSendWhatsapp] = useState(true);
            const [syncCalendar, setSyncCalendar] = useState(true);
            const [showSuccess, setShowSuccess] = useState(false);
            const [savedAppointment, setSavedAppointment] = useState(null);

            const services = [
                { name: 'Consulta', duration: 30 },
                { name: 'Corte de Cabelo', duration: 45 },
                { name: 'Manicure', duration: 60 },
                { name: 'Massagem', duration: 90 },
                { name: 'Personal Trainer', duration: 60 },
                { name: 'Aula Particular', duration: 50 }
            ];

            const timeSlots = ['08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00'];

            const handleSubmit = (e) => {
                e.preventDefault();
                const selectedService = services.find(s => s.name === formData.service);
                const appointment = {
                    id: generateId(),
                    ...formData,
                    duration: selectedService?.duration || formData.duration,
                    status: 'confirmed',
                    whatsappSent: false,
                    calendarSynced: false,
                    createdAt: new Date().toISOString()
                };

                onSave(appointment);
                setSavedAppointment(appointment);
                setShowSuccess(true);

                if (sendWhatsapp) setTimeout(() => sendWhatsAppMessage(appointment), 500);
                if (syncCalendar) setTimeout(() => addToGoogleCalendar(appointment), 1000);
            };

            const resetForm = () => {
                setFormData({ clientName: '', clientPhone: '', service: '', date: '', time: '', duration: 30, notes: '' });
                setShowSuccess(false);
                setSavedAppointment(null);
            };

            if (showSuccess && savedAppointment) {
                return (
                    <div className="p-6 lg:p-8 max-w-4xl mx-auto animate-fadeIn">
                        <div className="mb-8">
                            <h1 className="text-2xl lg:text-3xl font-bold text-slate-800">Novo Agendamento</h1>
                        </div>
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center animate-bounceIn">
                            <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 text-emerald-600 text-3xl">
                                <Icons.Check />
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">Agendamento Criado!</h2>
                            <p className="text-slate-500 mb-6">
                                O agendamento de <strong>{savedAppointment.clientName}</strong> para <strong>{savedAppointment.service}</strong> foi criado com sucesso.
                            </p>
                            <div className="flex flex-col sm:flex-row gap-3 justify-center mb-6">
                                {sendWhatsapp && (
                                    <div className="flex items-center gap-2 px-4 py-2 bg-green-50 rounded-xl">
                                        <Icons.WhatsApp />
                                        <span className="text-sm text-green-700">WhatsApp enviado</span>
                                    </div>
                                )}
                                {syncCalendar && (
                                    <div className="flex items-center gap-2 px-4 py-2 bg-blue-50 rounded-xl">
                                        <Icons.Google />
                                        <span className="text-sm text-blue-700">Google Agenda sincronizado</span>
                                    </div>
                                )}
                            </div>
                            <button onClick={resetForm} className="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl font-medium shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 transition-all">
                                Novo Agendamento
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-6 lg:p-8 max-w-4xl mx-auto animate-fadeIn">
                    <div className="mb-8">
                        <h1 className="text-2xl lg:text-3xl font-bold text-slate-800">Novo Agendamento</h1>
                        <p className="text-slate-500 mt-1">Preencha os dados para criar um novo agendamento</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-slideUp">
                            <h3 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                                <span className="text-emerald-500"><Icons.User /></span> Dados do Cliente
                            </h3>
                            <div className="grid sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Nome do Cliente</label>
                                    <input type="text" required value={formData.clientName} onChange={(e) => setFormData({...formData, clientName: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none" placeholder="Ex: João Silva" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1.5">WhatsApp do Cliente</label>
                                    <input type="tel" required value={formData.clientPhone} onChange={(e) => setFormData({...formData, clientPhone: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none" placeholder="Ex: 5511999999999" />
                                    <p className="text-xs text-slate-400 mt-1">Formato: DDD + número</p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-slideUp" style={{ animationDelay: '100ms' }}>
                            <h3 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                                <span className="text-emerald-500"><Icons.Calendar /></span> Serviço e Horário
                            </h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Serviço</label>
                                    <select required value={formData.service} onChange={(e) => setFormData({...formData, service: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none">
                                        <option value="">Selecione um serviço</option>
                                        {services.map(s => <option key={s.name} value={s.name}>{s.name} ({s.duration} min)</option>)}
                                    </select>
                                </div>
                                <div className="grid sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Data</label>
                                        <input type="date" required value={formData.date} onChange={(e) => setFormData({...formData, date: e.target.value})} min={new Date().toISOString().split('T')[0]} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Horário</label>
                                        <select required value={formData.time} onChange={(e) => setFormData({...formData, time: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none">
                                            <option value="">Selecione o horário</option>
                                            {timeSlots.map(t => <option key={t} value={t}>{t}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-slideUp" style={{ animationDelay: '200ms' }}>
                            <h3 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                                <span className="text-emerald-500"><Icons.FileText /></span> Observações
                            </h3>
                            <textarea value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} rows={3} className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none resize-none" placeholder="Observações adicionais..." />
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-slideUp" style={{ animationDelay: '300ms' }}>
                            <h3 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                                <span className="text-emerald-500"><Icons.Send /></span> Integrações Automáticas
                            </h3>
                            <div className="space-y-3">
                                <label className="flex items-center gap-3 p-3 rounded-xl bg-green-50 border border-green-100 cursor-pointer hover:bg-green-100 transition-colors">
                                    <input type="checkbox" checked={sendWhatsapp} onChange={(e) => setSendWhatsapp(e.target.checked)} className="w-5 h-5 rounded border-green-300 text-green-600 focus:ring-green-500" />
                                    <Icons.WhatsApp />
                                    <div>
                                        <p className="font-medium text-slate-800 text-sm">Enviar confirmação via WhatsApp</p>
                                        <p className="text-xs text-slate-500">Abre o WhatsApp com mensagem pré-formatada</p>
                                    </div>
                                </label>
                                <label className="flex items-center gap-3 p-3 rounded-xl bg-blue-50 border border-blue-100 cursor-pointer hover:bg-blue-100 transition-colors">
                                    <input type="checkbox" checked={syncCalendar} onChange={(e) => setSyncCalendar(e.target.checked)} className="w-5 h-5 rounded border-blue-300 text-blue-600 focus:ring-blue-500" />
                                    <Icons.Google />
                                    <div>
                                        <p className="font-medium text-slate-800 text-sm">Sincronizar com Google Agenda</p>
                                        <p className="text-xs text-slate-500">Cria evento automaticamente no Google Calendar</p>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <button type="submit" className="w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl font-medium shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 transition-all duration-200 hover:-translate-y-0.5 animate-slideUp" style={{ animationDelay: '400ms' }}>
                            Criar Agendamento
                        </button>
                    </form>
                </div>
            );
        }

        // Lista de Agendamentos
        function AppointmentList({ appointments, onUpdate, onDelete }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');

            const filteredAppointments = appointments
                .filter(apt => {
                    const matchesSearch = apt.clientName.toLowerCase().includes(searchTerm.toLowerCase()) || apt.service.toLowerCase().includes(searchTerm.toLowerCase()) || apt.clientPhone.includes(searchTerm);
                    const matchesFilter = filterStatus === 'all' || apt.status === filterStatus;
                    return matchesSearch && matchesFilter;
                })
                .sort((a, b) => new Date(`${b.date}T${b.time}`) - new Date(`${a.date}T${a.time}`));

            const getStatusBadge = (status) => {
                const styles = { confirmed: 'bg-emerald-100 text-emerald-700', pending: 'bg-amber-100 text-amber-700', cancelled: 'bg-red-100 text-red-700', completed: 'bg-blue-100 text-blue-700' };
                const labels = { confirmed: 'Confirmado', pending: 'Pendente', cancelled: 'Cancelado', completed: 'Concluído' };
                return <span className={`px-2.5 py-1 text-xs font-medium rounded-lg ${styles[status]}`}>{labels[status]}</span>;
            };

            return (
                <div className="p-6 lg:p-8 max-w-7xl mx-auto animate-fadeIn">
                    <div className="mb-8">
                        <h1 className="text-2xl lg:text-3xl font-bold text-slate-800">Agendamentos</h1>
                        <p className="text-slate-500 mt-1">Gerencie todos os seus agendamentos</p>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 mb-6">
                        <div className="relative flex-1">
                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></span>
                            <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Buscar por nome, serviço ou telefone..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none" />
                        </div>
                        <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="px-4 py-2.5 rounded-xl border border-slate-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all outline-none bg-white">
                            <option value="all">Todos</option>
                            <option value="confirmed">Confirmados</option>
                            <option value="pending">Pendentes</option>
                            <option value="completed">Concluídos</option>
                            <option value="cancelled">Cancelados</option>
                        </select>
                    </div>

                    <p className="text-sm text-slate-500 mb-4">{filteredAppointments.length} agendamento{filteredAppointments.length !== 1 ? 's' : ''}</p>

                    <div className="space-y-3">
                        {filteredAppointments.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-slate-100">
                                <div className="text-slate-300 text-4xl mb-3"><Icons.Calendar /></div>
                                <p className="text-slate-400 font-medium">Nenhum agendamento encontrado</p>
                            </div>
                        ) : (
                            filteredAppointments.map((apt, index) => (
                                <div key={apt.id} className="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all p-4 sm:p-5 animate-slideUp" style={{ animationDelay: `${index * 30}ms` }}>
                                    <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                                        <div className="flex items-center gap-3 sm:flex-col sm:items-center sm:w-16">
                                            <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 flex flex-col items-center justify-center text-white shadow-sm">
                                                <span className="text-xs font-medium">{new Date(apt.date).toLocaleDateString('pt-BR', { month: 'short' }).slice(0, 3)}</span>
                                                <span className="text-lg font-bold">{new Date(apt.date).getDate()}</span>
                                            </div>
                                            <span className="text-sm text-slate-500 font-medium">{apt.time}</span>
                                        </div>

                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-2 mb-1">
                                                <h3 className="font-semibold text-slate-800 truncate">{apt.clientName}</h3>
                                                {getStatusBadge(apt.status)}
                                            </div>
                                            <p className="text-sm text-slate-500">{apt.service} • {apt.duration} min</p>
                                            <div className="flex items-center gap-3 mt-2">
                                                {apt.whatsappSent && <span className="flex items-center gap-1 text-xs text-green-600"><Icons.WhatsApp /> WhatsApp enviado</span>}
                                                {apt.calendarSynced && <span className="flex items-center gap-1 text-xs text-blue-600"><Icons.Google /> Google Agenda</span>}
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-2 flex-wrap">
                                            <button onClick={() => sendWhatsAppMessage(apt)} className="p-2 rounded-lg hover:bg-green-50 text-slate-500 hover:text-green-600 transition-colors" title="Enviar WhatsApp"><Icons.WhatsApp /></button>
                                            <button onClick={() => addToGoogleCalendar(apt)} className="p-2 rounded-lg hover:bg-blue-50 text-slate-500 hover:text-blue-600 transition-colors" title="Sincronizar Google Agenda"><Icons.Google /></button>
                                            {apt.status !== 'completed' && <button onClick={() => onUpdate({...apt, status: 'completed'})} className="p-2 rounded-lg hover:bg-emerald-50 text-slate-500 hover:text-emerald-600 transition-colors" title="Concluir"><Icons.Check /></button>}
                                            {apt.status !== 'cancelled' && <button onClick={() => onUpdate({...apt, status: 'cancelled'})} className="p-2 rounded-lg hover:bg-red-50 text-slate-500 hover:text-red-600 transition-colors" title="Cancelar"><Icons.X /></button>}
                                            <button onClick={() => onDelete(apt.id)} className="p-2 rounded-lg hover:bg-red-50 text-slate-500 hover:text-red-600 transition-colors" title="Excluir"><Icons.Trash /></button>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // Configurações
        function Settings() {
            return (
                <div className="p-6 lg:p-8 max-w-4xl mx-auto animate-fadeIn">
                    <div className="mb-8">
                        <h1 className="text-2xl lg:text-3xl font-bold text-slate-800">Configurações</h1>
                        <p className="text-slate-500 mt-1">Configure as integrações e preferências</p>
                    </div>

                    <div className="space-y-6">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-slideUp">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center text-green-600"><Icons.WhatsApp /></div>
                                <div>
                                    <h3 className="font-semibold text-slate-800">Integração WhatsApp</h3>
                                    <p className="text-sm text-slate-500">Configure o envio de mensagens automáticas</p>
                                </div>
                            </div>
                            <div className="p-4 bg-green-50 rounded-xl border border-green-100">
                                <div className="flex items-center gap-2 mb-2">
                                    <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                    <span className="text-sm font-medium text-green-700">Funcionando via wa.me</span>
                                </div>
                                <p className="text-xs text-slate-600">O sistema abre o WhatsApp com mensagem pré-formatada. Basta enviar!</p>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 animate-slideUp" style={{ animationDelay: '100ms' }}>
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center text-blue-600"><Icons.Google /></div>
                                <div>
                                    <h3 className="font-semibold text-slate-800">Integração Google Agenda</h3>
                                    <p className="text-sm text-slate-500">Sincronize eventos automaticamente</p>
                                </div>
                            </div>
                            <div className="p-4 bg-blue-50 rounded-xl border border-blue-100">
                                <div className="flex items-center gap-2 mb-2">
                                    <div className="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
                                    <span className="text-sm font-medium text-blue-700">Funcionando via URL</span>
                                </div>
                                <p className="text-xs text-slate-600">O sistema gera um link do Google Calendar com todos os dados preenchidos.</p>
                            </div>
                        </div>

                        <div className="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-2xl border border-emerald-100 p-6 animate-slideUp" style={{ animationDelay: '200ms' }}>
                            <div className="flex items-start gap-3">
                                <span className="text-emerald-600 mt-0.5"><Icons.Info /></span>
                                <div>
                                    <h4 className="font-medium text-emerald-800 mb-1">Como funciona a integração?</h4>
                                    <ul className="text-sm text-emerald-700 space-y-1.5">
                                        <li>• <strong>WhatsApp:</strong> Ao criar um agendamento, o sistema abre o WhatsApp com a mensagem de confirmação pré-formatada.</li>
                                        <li>• <strong>Google Agenda:</strong> O sistema gera um link que abre o Google Calendar com todos os dados preenchidos.</li>
                                        <li>• <strong>Para automação completa:</strong> Integre com a API do WhatsApp Business e Google Calendar API usando um backend.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // App Principal
        function App() {
            const [currentView, setCurrentView] = useState('dashboard');
            const [appointments, setAppointments] = useState([]);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            useEffect(() => {
                const stored = localStorage.getItem('agendaflow_appointments');
                if (stored) setAppointments(JSON.parse(stored));
            }, []);

            useEffect(() => {
                localStorage.setItem('agendaflow_appointments', JSON.stringify(appointments));
            }, [appointments]);

            const handleSaveAppointment = (appointment) => setAppointments(prev => [...prev, appointment]);
            const handleUpdateAppointment = (updated) => setAppointments(prev => prev.map(a => a.id === updated.id ? updated : a));
            const handleDeleteAppointment = (id) => setAppointments(prev => prev.filter(a => a.id !== id));

            const renderView = () => {
                switch (currentView) {
                    case 'dashboard': return <Dashboard appointments={appointments} onNewAppointment={() => setCurrentView('schedule')} />;
                    case 'schedule': return <ScheduleForm onSave={handleSaveAppointment} />;
                    case 'appointments': return <AppointmentList appointments={appointments} onUpdate={handleUpdateAppointment} onDelete={handleDeleteAppointment} />;
                    case 'settings': return <Settings />;
                    default: return null;
                }
            };

            return (
                <div className="flex min-h-screen bg-slate-50">
                    <Sidebar currentView={currentView} onViewChange={setCurrentView} isOpen={sidebarOpen} onClose={() => setSidebarOpen(false)} />
                    <main className="flex-1 min-h-screen overflow-auto">
                        <div className="lg:hidden sticky top-0 z-30 bg-white/80 backdrop-blur-lg border-b border-slate-100 px-4 py-3 flex items-center justify-between">
                            <button onClick={() => setSidebarOpen(true)} className="p-2 rounded-lg hover:bg-slate-100 transition-colors"><Icons.Menu /></button>
                            <div className="flex items-center gap-2">
                                <div className="w-7 h-7 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-lg flex items-center justify-center text-white text-xs font-bold">A</div>
                                <span className="font-bold text-slate-800 text-sm">AgendaFlow</span>
                            </div>
                            <div className="w-9"></div>
                        </div>
                        <div key={currentView} className="animate-fadeIn">{renderView()}</div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
